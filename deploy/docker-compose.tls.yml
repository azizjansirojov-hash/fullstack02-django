# Self-signed TLS overlay for local HTTPS verification.
# Usage:
#   bash deploy/generate_selfsigned_cert.sh
#   docker compose --env-file backend/.env -f docker-compose.yml -f deploy/docker-compose.tls.yml up -d --build
#
# Then:
#   curl -sI http://localhost/        # 301 -> https
#   curl -skI https://localhost/      # 200 + HSTS

services:
  web:
    environment:
      USE_TLS: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
      CSRF_TRUSTED_ORIGINS: https://localhost,https://127.0.0.1

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_started
