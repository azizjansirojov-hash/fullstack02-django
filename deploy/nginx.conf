# Example nginx TLS terminator in front of Gunicorn (Libro.UZ)
#
# Replace libro.example.com and certificate paths, then:
#   proxy_pass http://127.0.0.1:8000;  # or Docker service "web:8000" on a shared network

upstream libro_web {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name libro.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name libro.example.com;

    ssl_certificate     /etc/letsencrypt/live/libro.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/libro.example.com/privkey.pem;

    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://libro_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
