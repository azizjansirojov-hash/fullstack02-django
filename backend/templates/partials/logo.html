{% comment %}
  Libro.UZ vertical lockup. Include with:
  {% include "partials/logo.html" with size="sm" %}
  size: "sm" (header) | "lg" (splash)
{% endcomment %}
<span class="brand-lockup brand-lockup--{{ size|default:'sm' }}" aria-hidden="true">
  <svg
    class="brand-lockup__icon"
    viewBox="0 0 64 64"
    width="{% if size == 'lg' %}96{% else %}28{% endif %}"
    height="{% if size == 'lg' %}96{% else %}28{% endif %}"
    role="img"
    focusable="false"
  >
    <defs>
      <linearGradient id="libro-logo-grad-{{ size|default:'sm' }}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e4ff54" />
        <stop offset="55%" stop-color="#4fe08a" />
        <stop offset="100%" stop-color="#2fd39b" />
      </linearGradient>
    </defs>
    <path
      fill="url(#libro-logo-grad-{{ size|default:'sm' }})"
      d="M6.5 14c0-1.7 1.1-3.1 2.8-3.4 4-.8 9.2-1.6 14.2-1.6 2 0 3.5 1.5 3.5 3.5v31.5c0 2.4-1.6 4.5-3.9 5.1-4 1.1-9.1 2.1-14.1 1.3-1.7-.3-2.9-1.8-2.9-3.5V14z"
    />
    <path
      fill="url(#libro-logo-grad-{{ size|default:'sm' }})"
      d="M57.5 14c0-1.7-1.1-3.1-2.8-3.4-4-.8-9.2-1.6-14.2-1.6-2 0-3.5 1.5-3.5 3.5v31.5c0 2.4 1.6 4.5 3.9 5.1 4 1.1 9.1 2.1 14.1 1.3 1.7-.3 2.9-1.8 2.9-3.5V14z"
    />
  </svg>
  <span class="brand-lockup__wordmark">Libro<span class="brand-lockup__dot">.</span>UZ</span>
</span>
